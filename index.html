
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff7ef;
  color: #713d20;
  text-align: center;
}
.kartu {
  padding: 28px 12px;
  border-radius: 16px;
  background: linear-gradient(135deg, #fff7ef, #ffe4c8);
}
h2 { color: #e87524; margin-bottom: 8px; }
.angka {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
.item {
  background: white;
  border-radius: 10px;
  padding: 14px 8px;
  min-width: 62px;
  box-shadow: 0 2px 8px #00000010;
}
.nomor { font-size: 28px; font-weight: bold; color: #e87524; }
.label { font-size: 12px; }
</style>
</head>
<body>
<div class="kartu">
  <div style="font-size:36px">🌙</div>
  <h2>RAMADHAN 1448 H</h2>
  <p>Harta Lebih Berkah, Kebaikan Lebih Berdampak</p>
  <p>Menuju Bulan Penuh Berkah</p>

  <div class="angka">
    <div class="item"><div class="nomor" id="hari">-</div><div class="label">Hari</div></div>
    <div class="item"><div class="nomor" id="jam">-</div><div class="label">Jam</div></div>
    <div class="item"><div class="nomor" id="menit">-</div><div class="label">Menit</div></div>
    <div class="item"><div class="nomor" id="detik">-</div><div class="label">Detik</div></div>
  </div>
  <p id="pesan">Persiapkan diri menyambut Ramadhan.</p>
  <small>*Tanggal awal Ramadhan menunggu penetapan resmi.</small>
</div>

<script>
const target = new Date("2027-02-08T00:00:00+07:00").getTime();

function hitungMundur() {
  let sisa = target - Date.now();

  if (sisa <= 0) {
    document.getElementById("hari").textContent = "0";
    document.getElementById("jam").textContent = "00";
    document.getElementById("menit").textContent = "00";
    document.getElementById("detik").textContent = "00";
    document.getElementById("pesan").textContent =
      "Ramadhan telah tiba menurut tanggal perkiraan.";
    return;
  }

  document.getElementById("hari").textContent =
    Math.floor(sisa / 86400000);
  document.getElementById("jam").textContent =
    String(Math.floor(sisa / 3600000) % 24).padStart(2, "0");
  document.getElementById("menit").textContent =
    String(Math.floor(sisa / 60000) % 60).padStart(2, "0");
  document.getElementById("detik").textContent =
    String(Math.floor(sisa / 1000) % 60).padStart(2, "0");
}

hitungMundur();
setInterval(hitungMundur, 1000);
</script>
</body>
</html>
